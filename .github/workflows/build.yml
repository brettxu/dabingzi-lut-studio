name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install

      - name: Restore protected sources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/lut-core/src" | Out-Null
          [System.IO.File]::WriteAllBytes("src-tauri/lut-core/src/lib.rs", [Convert]::FromBase64String("${{ secrets.LUT_CORE_B64 }}"))
          [System.IO.File]::WriteAllBytes("src-tauri/src/config.rs", [Convert]::FromBase64String("${{ secrets.LUT_CONFIG_B64 }}"))

      - name: Build (release)
        run: npx tauri build --ci

      - name: Stage release files
        shell: pwsh
        run: |
          Copy-Item src-tauri/target/release/lut-studio-desktop.exe dabingzi-lut-studio.exe
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe dabingzi-lut-studio-setup.exe

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dabingzi-lut-studio.exe
            dabingzi-lut-studio-setup.exe
          tag_name: v1.1.0
          name: 大饼子--万能lut生成器 v1.1.0
          body: |
            **图片仿色 LUT 生成器**（Lightroom 风格界面）
            - 上传原图 + 参考图，自动匹配色调
            - 明暗 / 色彩 / 细节 / 校准 全参数实时调色
            - 一键导出 .cube LUT（PS、Lightroom、剪映可用）和效果图
            - 免安装直接运行（Win10 及以上，无需任何环境）

            **下载**：dabingzi-lut-studio.exe（免安装直接运行，推荐）
            　　　　　dabingzi-lut-studio-setup.exe（安装包）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lut-exe-windows
          path: |
            src-tauri/target/release/lut-studio-desktop.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
