name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install

      - name: Restore protected sources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/lut-core/src" | Out-Null
          [System.IO.File]::WriteAllBytes("src-tauri/lut-core/src/lib.rs", [Convert]::FromBase64String("${{ secrets.LUT_CORE_B64 }}"))
          [System.IO.File]::WriteAllBytes("src-tauri/src/config.rs", [Convert]::FromBase64String("${{ secrets.LUT_CONFIG_B64 }}"))

      - name: Clean build cache (force recompile for version bump)
        run: cd src-tauri && cargo clean

      - name: Build (release)
        run: npx tauri build --ci

      - name: Stage release files
        shell: pwsh
        run: |
          Copy-Item src-tauri/target/release/lut-studio-desktop.exe dabingzi-lut-studio-v1.7.1.exe
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe dabingzi-lut-studio-v1.7.1-setup.exe

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dabingzi-lut-studio-v1.7.1.exe
            dabingzi-lut-studio-v1.7.1-setup.exe
          tag_name: v1.7.1
          name: 大饼子--万能lut生成器 v1.7.1
          body: |
            **图片仿色 LUT 生成器**（Lightroom 风格界面）
            - v1.7.1 新增导入外部 .cube LUT：可在已有 LUT 基础上继续调整后再导出；导入 LUT 与参考图二选一、共用匹配强度；修复删除图片后同名文件可再次上传
            - v1.7.0 新增 RGB 曲线工具：独立模块（细节与校准之间），L/R/G/B 四通道可打点拖动，+3点一键布点，效果全部烧入导出的 .cube
            - v1.6.0 匹配强度上限放开到200%：100%为完整还原参考图，超过100%沿参考图方向外推、强化/夸张风格（只动颜色不碰光影），滑块100%处加刻度线
            - v1.5.2 修复对比视图（原图vs结果/参考vs结果）在50%/100%放大档：两层同步等大缩放、放大自动居中、可拖到图片任意边缘
            - v1.5.1 肤色选取升级为亮度纺锤包络：阴影/中间调/高光肤色全覆盖，亮暗交界不再出斑块
            - v1.5.0 参考图匹配升级为 IDT 切片最优传输：颜色连续对应、不锁色相边界，参考图没有的颜色保持不动，只改颜色不碰光影
            - 上传原图 + 参考图，自动匹配色调
            - 明暗 / 色彩 / 细节 / 校准 全参数实时调色
            - 独有色环校准模式，六色扇形随意拖动
            - 独创亮部和暗部色温色调，分离图片色调
            - 一键导出 .cube LUT（PS、Lightroom、剪映、达芬奇可用）和效果图
            - 免安装直接运行（Win10 及以上，无需任何环境）

            **下载**：dabingzi-lut-studio-v1.7.1.exe（免安装直接运行，推荐）
            　　　　　dabingzi-lut-studio-v1.7.1-setup.exe（安装包）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lut-exe-windows
          path: |
            src-tauri/target/release/lut-studio-desktop.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
